<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Acme Staff Portal</title>
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <main class="portal">
    <h1>Acme Staff Portal</h1>
    <p class="sub">Training target for the Tripline lab. Weak passwords on purpose.</p>
    <form method="post" action="/login">
      <label>Username <input name="username" autocomplete="off" spellcheck="false" autocapitalize="off"></label>
      <label>Password <input name="password" type="password"></label>
      <button type="submit">Sign in</button>
    </form>
    <p class="sub"><a href="/">Open the Tripline dashboard</a> in another window and watch it while you sign in.</p>
  </main>
</body>
</html>
