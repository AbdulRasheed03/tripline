name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests before publishing
        run: npm test
      - name: Collect the browser demo (dashboard plus the shared engine, no server files)
        run: |
          mkdir -p _site/src
          cp web/index.html web/app.js web/demo.js web/style.css web/favicon.svg _site/
          cp src/engine.js src/labdata.js _site/src/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Separate job: the Pages artifact is only visible to deploy-pages once the uploading job has finished.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
