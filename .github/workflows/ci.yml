name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Replay the sample SSH log (exit code 2 means it found the attacks)
        run: |
          set +e
          node cli/tripline.mjs replay samples/auth.log --year 2026 --no-color
          test $? -eq 2
      - name: Replay the sample web log and build an incident report
        run: |
          set +e
          node cli/tripline.mjs replay samples/access.log --no-color
          test $? -eq 2 || exit 1
          node cli/tripline.mjs replay samples/access.log --md > incident.md
          grep -q "highest severity critical" incident.md
